# Reusable: builds one image x one stream x one variant. See scripts/build.sh.
name: build

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      stream:
        type: string
        required: true
      variant:
        type: string
        required: false
        default: ""
      push:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apko and yq (pinned, sha256 verified)
        run: make tools

      - name: Compute names
        id: names
        env:
          IMAGE: ${{ inputs.image }}
          STREAM: ${{ inputs.stream }}
          VARIANT: ${{ inputs.variant }}
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          name="$IMAGE-$STREAM"
          if [ -n "$VARIANT" ]; then name="$name-$VARIANT"; fi
          {
            echo "registry=ghcr.io/$owner"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, test and publish
        id: build
        env:
          PUSH: ${{ inputs.push && '1' || '0' }}
          REGISTRY: ${{ steps.names.outputs.registry }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          IMAGE: ${{ inputs.image }}
          STREAM: ${{ inputs.stream }}
          VARIANT: ${{ inputs.variant }}
        run: scripts/build.sh "$IMAGE" "$STREAM" "$VARIANT"

      - name: Install cosign
        if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless)
        if: inputs.push
        env:
          REGISTRY: ${{ steps.names.outputs.registry }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REGISTRY/$IMAGE@$DIGEST"

      - name: Attest build provenance
        if: inputs.push
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.registry }}/${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload lock file and SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.names.outputs.name }}
          path: |
            out/*.lock.json
            out/sbom-*/
          if-no-files-found: warn
