contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - valkey-${STREAM}${PIN}
    - valkey-${STREAM}-cli${PIN}
    - bash
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: valkey
      gid: 65532
  users:
    - username: valkey
      uid: 65532
      gid: 65532
  run-as: 65532

work-dir: /data

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

entrypoint:
  command: /usr/bin/valkey-server

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.source: ${SOURCE_URL}
  org.opencontainers.image.description: Valkey (Redis-compatible) image built on Wolfi
