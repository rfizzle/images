contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - python-${STREAM}${PIN}
    - py3-pip-wheel
    - ca-certificates-bundle
    - python-${STREAM}-dev
    - py${STREAM}-pip
    - py${STREAM}-setuptools
    - uv
    - apk-tools
    - bash
    - build-base
    - busybox
    - git
    - linux-headers
    - openssf-compiler-options
    - pkgconf
    - posix-cc-wrappers
    - wget

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

work-dir: /app

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o777

entrypoint:
  command: /usr/bin/python

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.source: ${SOURCE_URL}
  org.opencontainers.image.description: Python runtime image built on Wolfi
