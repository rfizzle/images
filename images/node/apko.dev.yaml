contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - nodejs-${STREAM}${PIN}
    - npm
    - dumb-init
    - busybox
    - ca-certificates-bundle
    - apk-tools
    - bash
    - build-base
    - corepack
    - git
    - linux-headers
    - node-gyp
    - pkgconf
    - pnpm
    - posix-cc-wrappers
    - wget
    - yarn

accounts:
  groups:
    - groupname: node
      gid: 65532
  users:
    - username: node
      uid: 65532
      gid: 65532
  run-as: 65532

work-dir: /app

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o777

environment:
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

entrypoint:
  command: /usr/bin/node

cmd: --help

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.source: ${SOURCE_URL}
  org.opencontainers.image.description: Node.js runtime image built on Wolfi
