contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - postgresql-${STREAM}${PIN}
    - postgresql-${STREAM}-client${PIN}
    - postgresql-${STREAM}-contrib${PIN}
    - postgresql-${STREAM}-oci-entrypoint${PIN}
    - bash
    - busybox
    - gosu
    - glibc-locale-en
    - ca-certificates-bundle
    - tzdata
    - apk-tools
    - git
    - wget

accounts:
  groups:
    - groupname: postgres
      gid: 70
  users:
    - username: postgres
      uid: 70
      gid: 70
      homedir: /home/postgres
  run-as: 0

work-dir: /home/postgres

paths:
  - path: /var/lib/postgresql
    type: directory
    uid: 70
    gid: 70
    permissions: 0o777
    recursive: true
  - path: /var/run/postgresql
    type: directory
    uid: 70
    gid: 70
    permissions: 0o777
    recursive: true

environment:
  LANG: en_US.UTF-8
  PGDATA: /var/lib/postgresql/data

entrypoint:
  command: /usr/bin/docker-entrypoint.sh postgres

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.source: ${SOURCE_URL}
  org.opencontainers.image.description: PostgreSQL database image built on Wolfi
