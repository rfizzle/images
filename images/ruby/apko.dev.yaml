contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - ruby-${STREAM}${PIN}
    - ruby${STREAM}-json
    - yaml
    - ca-certificates-bundle
    - ruby-${STREAM}-dev
    - ruby${STREAM}-bundler
    - jemalloc-dev
    - apk-tools
    - bash
    - build-base
    - busybox
    - git
    - linux-headers
    - openssf-compiler-options
    - pkgconf
    - posix-cc-wrappers
    - wget

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

work-dir: /work

paths:
  - path: /work
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o777

entrypoint:
  command: /usr/bin/ruby

cmd: --version

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.source: ${SOURCE_URL}
  org.opencontainers.image.description: Ruby runtime image built on Wolfi
