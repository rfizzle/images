contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - go-${STREAM}${PIN}
    - build-base
    - busybox
    - ca-certificates-bundle
    - git
    - linux-headers
    - openssh-client
    - openssf-compiler-options
    - pkgconf
    - posix-cc-wrappers
    - apk-tools
    - bash
    - wget

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 0

environment:
  GOTOOLCHAIN: local+auto
  GODEBUG: tarinsecurepath=0,zipinsecurepath=0

entrypoint:
  command: /usr/bin/go

cmd: help

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.source: ${SOURCE_URL}
  org.opencontainers.image.description: Go toolchain image built on Wolfi
